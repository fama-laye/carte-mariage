<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invitation de Mariage - MR & MRS GNINGUE</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Couleurs Thème */
        :root {
            --primary-color: #d4af37; /* Couleur Or doré */
            --secondary-color: #2c3e50; /* Bleu nuit élégant */
            --background-color: #f7f9fa; /* Fond clair épuré */
            --card-bg: #ffffff;
            --text-color: #4a4a4a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: var(--background-color);
            color: var(--text-color);
            line-height: 1.6;
            padding: 10px;
        }

        /* Boîte principale de l’invitation */
        .container {
            max-width: 600px;
            margin: 15px auto 20px auto;
            background: var(--card-bg);
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            border-radius: 12px;
            overflow: hidden;
        }
        
        /* Bannière d’accueil photo - Cadrage ajusté sur le haut (top center) */
        .header-banner {
            background: linear-gradient(rgba(26, 42, 58, 0.3), rgba(26, 42, 58, 0.5)), url('astou.png') top center/cover;
            color: white;
            text-align: center;
            padding: 110px 20px;
            border-bottom: 4px solid var(--primary-color);
        }

        .header-banner h1 {
            font-family: 'Alex Brush', cursive;
            font-size: 3.5rem;
            color: var(--primary-color);
            margin-bottom: 10px;
            user-select: none;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        .header-banner p {
            font-size: 1.1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-weight: 300;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
        }

        /* Style des sections */
        .section {
            padding: 30px 25px;
            border-bottom: 1px solid #eee;
        }
        
        .section-title {
            font-size: 1.2rem;
            color: var(--secondary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title i {
            color: var(--primary-color);
        }

        /* Grille des détails (Date & Lieu) */
        .detail-item {
            display: flex;
            align-items: center;
            gap: 15px;
            background: #fdfbf7;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            border-left: 3px solid var(--primary-color);
        }

        .detail-item i {
            font-size: 1.4rem;
            color: var(--secondary-color);
            width: 25px;
        }
        
        .detail-text h4 {
            font-size: 0.85rem;
            text-transform: uppercase;
            color: #888;
        }

        .detail-text p {
            font-weight: 600;
            color: var(--secondary-color);
        }

        /* NOUVEAU : Style pour le lien de localisation */
        .maps-link {
            color: var(--secondary-color);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: color 0.3s ease;
        }

        .maps-link:hover {
            color: var(--primary-color);
            text-decoration: underline;
        }

        /* Boutons d’action */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px;
            background-color: var(--secondary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 10px;
            transition: background-color 0.3s ease;
        }

        .btn:hover {
            background-color: #2c3e50;
        }

        .btn-whatsapp {
            background-color: #25D366;
        }

        .btn-whatsapp:hover {
            background-color: #1ebd56;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <div class="header-banner">
            <h1>MR & MRS GNINGUE</h1>
            <p>Se disent «Oui»</p>
        </div>

        <div class="section">
            <h2 class="section-title"><i class="fa-solid fa-calendar-days"></i> Programme</h2>
            <div class="detail-item">
                <i class="fa-solid fa-clock"></i>
                <div class="detail-text">
                    <h4>Date & Heure</h4>
                    <p>Samedi 4 juin 2026</p>
                </div>
            </div>
            <div class="detail-item">
                <i class="fa-solid fa-location-dot"></i>
                <div class="detail-text">
                    <h4>Lieu de la Réception</h4>
                    <!-- MODIFICATION ICI : Remplacer l'adresse par un lien -->
                    <p>
                        <a href="https://maps.app.goo.gl/fsFiJ8AuCnQRs3SC9" target="_blank" rel="noopener noreferrer" class="maps-link">
                            Grand-Dakar, Rue-GD-44, Dakar
                            <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 0.7rem;"></i>
                        </a>
                    </p>
                </div>
            </div>
        </div>

        <div class="section">
            <h2 class="section-title"><i class="fa-solid fa-share-nodes"></i> Envoyer </h2>
            <p style="font-size: 0.85rem; color: #666; margin-bottom: 15px;">
                Clique sur ce bouton pour partager l'invitation .
            </p>
            <button class="btn btn-whatsapp" onclick="partagerWhatsApp()">
                <i class="fa-brands fa-whatsapp"></i> Partager sur WhatsApp
            </button>
        </div>

        <div class="section">
            <h2 class="section-title"><i class="fa-solid fa-pen-fancy"></i> Confirmer votre présence</h2>
            
            <form action="https://formspree.io/f/xlgkazlk" method="POST">
                <div class="form-group">
                    <label>Votre Nom / Famille</label>
                    <input type="text" name="Nom de l'invite" class="form-control" placeholder="Ex: Fatou Diop" required>
                </div>
                <button type="submit" class="btn" style="background-color: var(--primary-color);">
                    <i class="fa-solid fa-check"></i> Confirmer ma venue
                </button>
            </form>
        </div>

    </div>

    <script>
        const maries = "Mr & Mrs GNINGUE";
        const dateEtHeure = "Samedi 4 juin 2026";
        const adresse = "Grand-Dakar,Rue-Derneville, Dakar";
        const urlSite = window.location.href; 
        
        function partagerWhatsApp() {
            const text = `✨ *INVITATION DE MARIAGE* ✨\n\nBonjour ! Nous avons le grand bonheur de vous inviter au mariage de *${maries}*.\n\n📅 *Date :* ${dateEtHeure}\n📍 *Lieu :* ${adresse}\n\n⚠️ *IMPORTANT :* Merci de cliquer sur le lien ci-dessous pour confirmer votre présence :\n👉 ${urlSite}`;
            window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
        }
    </script>
</body>
</html>
